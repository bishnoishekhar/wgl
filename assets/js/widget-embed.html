<!--
=====================================================================================
  widget-embed.html  -  SINGLE SOURCE OF TRUTH for the chat + voice assistant embed
=====================================================================================
  This file is NOT loaded by the browser. It is read by scripts/build_pages.py, which
  copies the two blocks below into EVERY page (index.html, pay-my-bill.html, ...):

    * the HEAD PART  -> into <head>, between the HEAD-START and HEAD-END markers
    * the BODY PART  -> into <div id="assistant-slot"> at the end of <body>,
                        between the BODY-START and BODY-END markers

  To change the widget (new deployment, new SDK version, new attributes):
    1. Edit ONLY the two blocks in this file.
    2. Run   python scripts/build_pages.py     (add --check to verify without writing)
    3. Reload the site.

  Source: the Google CX Agent Studio "web widget" snippet supplied by the owner, SDK v1.16,
  with these deliberate changes:
    - the owner's snippet used a bare <chat-messenger-container>, which the SDK renders INLINE in the
      page flow (not as a floating launcher). A <chat-messenger-chat-bubble> is the all-in-one floating
      component (launcher button + its own chat window), so the container's attributes and the three
      titlebar-action buttons now live on / inside the bubble and the separate container is gone.
      Tested in Chrome: with the bare container the chat window opened full-screen on phones and no
      launcher existed.
    - align-bottom-right docks the chat WINDOW bottom right; allow-fullscreen="small" makes it full-screen
      on phones (under 600px). The launcher button itself is pinned bottom right with 24px offset by
      widget-theme.css (the SDK leaves launcher placement to the host page).
    - <chat-messenger-close-button> was removed: in bubble mode the SDK already adds its own collapse
      arrow in the title bar and turns the launcher into a close (X) button, so a third close control
      only crowded the title ("Washington Gas Assistant" was being truncated). Add it back to the
      bubble if you want it.
    - chat-title is "Washington Gas Assistant"
    - chat-title-icon is an inline data-URI SVG of the site's flame mark (no external image)
    - enable-file-upload and enable-audio-input are kept (chat AND voice/microphone)
    - enableWelcomeEvent: false (Rev 18). The WEBSITE greets the visitor when the chat opens (assistant.js renders a
      page-aware welcome and the page chips with an English | Espanol toggle, no agent call and no welcome event).
      The agent is first invoked by a chip tap or typed text, with the widget variables {page_context, ui_language}
      that assistant.js keeps in sessionStorage "chat-messenger-variables"
    - chat-subtitle ("Online" line), placeholder-text, bot-writing-text added for the premium look
    - graphical cards: assets/js/assistant.js defines <wgl-card> and registers the card tools (see docs/widget-contract.md)
  Theming lives in assets/css/widget-theme.css (loaded after the SDK CSS).

  Voice: the SDK has no separate "call" attribute. Voice is: enable-audio-input (adds a
  microphone button next to the text box, used here), enable-audio-input-only (voice-only
  window) and start-with-recording (starts recording immediately; needs voice-only).
  The "chat / call / mixed" experience type is chosen when the web widget channel is created
  in Agent Studio (Deploy), not in the page markup.

  Token broker: the widget runs with the token broker enabled, so the page origin must be
  allowed in the channel settings (Agent Studio > Deploy > web widget channel):
      https://bishnoishekhar.github.io      (GitHub Pages)
      http://localhost:8000                 (local test)
  If the widget shows a 400 or does not open, check that first.
=====================================================================================
-->

    chatSdk.registerContext(
      chatSdk.prebuilts.ces.createContext({
        deploymentName: "projects/483471568825/locations/us/apps/5c509d39-b4e9-4d98-a61c-a261181fe038/deployments/c746ebd7-e448-4c29-a028-df672baa388c",

</script>
